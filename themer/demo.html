<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Themer v3.0 (Modular)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  
  <link rel="stylesheet" href="css/themer.css">

  <style>
     /* Just for the demo layout, not part of the plugin */
     html, body { width:100%; height:100%; overflow:auto; }
     .cd-container { width: min(900px, 95%); margin: 15vh auto 300px; position: relative; z-index: 10; }
     
     /* Tree styles that were generic to the card */
     .cd-card {
        padding: 36px;
        background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 25%), rgba(0,0,0,0.2);
        border-radius: 28px;
        border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(12px);
     }
     /* Tree connector lines */
     .cd-tree { display:flex; flex-direction:column; gap:20px; }
     .cd-children { margin-left:28px; padding-left:18px; display:flex; flex-direction:column; gap:14px; border-left:1px solid rgba(255,255,255,0.12); position:relative; }
     .cd-hue-node { display:flex; flex-direction:column; gap:16px; }
     .cd-info .cd-title { font-weight:600; font-size:16px; color:white; }
     .cd-info .cd-meta { font-size:11px; opacity:0.75; margin-top:4px; text-transform:uppercase; }
     .cd-badge { font-size:11px; font-weight:700; padding:6px 10px; border-radius:8px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.12); color:white; }
  </style>
</head>
<body>

  <h1 style="text-align:center; color:#fff; margin-top:10vh; opacity:0.95; font-weight:300;">Themer <span style="opacity:0.5; font-size:0.6em">v3.0</span></h1>

  <div class="cd-container cd-card">
    <div class="cd-tree">
      <div class="cd-hue-node">
        <div class="cd-node-inner">
          <div class="cd-info"><div class="cd-title">Core System</div><div class="cd-meta">Root</div></div>
          <div class="cd-badge">001</div>
        </div>
        <div class="cd-children">
          <div class="cd-hue-node">
            <div class="cd-node-inner">
              <div class="cd-info"><div class="cd-title">Nexus Alpha</div><div class="cd-meta">Depth I</div></div>
              <div class="cd-badge">A</div>
            </div>
          </div>
          <div class="cd-hue-node">
            <div class="cd-node-inner">
              <div class="cd-info"><div class="cd-title">Nexus Beta</div><div class="cd-meta">Depth I</div></div>
              <div class="cd-badge">B</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/index.js"></script>

</body>
</html>
